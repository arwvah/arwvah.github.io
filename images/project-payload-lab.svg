  <g font-size="14">
    <text x="66" y="126"><tspan fill="#5fd68b">$</tspan><tspan fill="#f2f3f4" dx="8">payload-lab inspect sample.bin</tspan></text>
    <text x="66" y="158" fill="#b9bfc7">→ format ELF64 · arch x86_64 · entry 0x401060</text>
