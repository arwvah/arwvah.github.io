    <text x="66" y="250" fill="#8a8f98">  .text    0x4a20   r-x  <tspan fill="#339af0">addr 0x401000</tspan></text>
    <text x="66" y="278" fill="#8a8f98">  .data    0x1180   rw-  <tspan fill="#339af0">addr 0x406000</tspan></text>
    <text x="66" y="306" fill="#8a8f98">  .rdata   0x2c40   r--  <tspan fill="#339af0">addr 0x408000</tspan></text>
    <text x="66" y="342" fill="#8a8f98">HEX DUMP @ .text</text>
    <text x="66" y="370"><tspan fill="#339af0">0x00401000</tspan><tspan fill="#8a8f98" dx="10">55 48 89 e5 48 83 ec 20</tspan><tspan fill="#f5d000" dx="16">|UH..H.. |</tspan></text>
    <text x="66" y="398"><tspan fill="#339af0">0x00401008</tspan><tspan fill="#8a8f98" dx="10">c7 45 fc 00 00 00 00 eb</tspan><tspan fill="#f5d000" dx="16">|.E..... |</tspan></text>
    <text x="66" y="426"><tspan fill="#339af0">0x00401010</tspan><tspan fill="#8a8f98" dx="10">0f b6 05 3c 2f 00 00 84</tspan><tspan fill="#f5d000" dx="16">|...&lt;/...|</tspan></text>
    <text x="66" y="462" fill="#8a8f98">SUSPICIOUS STRINGS</text>
