    <text x="66" y="596"><tspan fill="#339af0">→</tspan><tspan fill="#b9bfc7" dx="8">http://</tspan><tspan fill="#f5d000">185.220.[redacted].74</tspan><tspan fill="#b9bfc7" dx="4">/gate.php</tspan></text>
